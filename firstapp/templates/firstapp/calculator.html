{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Calculator</title>
    <link rel="stylesheet" href="{% static 'css/style2.css'%}">
</head>
<body>
    
    <div class="calculator">
        <h1>Marks Calculator</h1>
        <label>Subject 1 Marks:</label>
        <input type="number" id="subject1" placeholder="Enter marks for Subject 1">
        <label>Subject 2 Marks:</label>
        <input type="number" id="subject2" placeholder="Enter marks for Subject 2">
        <label>Subject 3 Marks:</label>
        <input type="number" id="subject3" placeholder="Enter marks for Subject 3">
        <button onclick="calculateMarks()">Calculate Total</button>
        <div id="result"></div>
            <p>Total Marks: <span id="total"></span></p>
            <p>Percentage: <span id="percentage"></span></p>
        </div>
    </div>    
    <script src="{% static 'js/script2.js'%}"></script>
</body>
</html>
